name: 问题反馈
description: 报告可复现的功能、视觉、性能或兼容性问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请提供可复现信息；上传日志前请移除个人路径和其他敏感内容。

  - type: textarea
    id: summary
    attributes:
      label: 问题现象
      description: 实际发生了什么？可以附上截图或短视频。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出能够稳定触发问题的最短步骤。
      placeholder: |
        1. 打开……
        2. 切换到……
        3. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你希望程序表现为什么样？
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: WB Toolbox 版本
      placeholder: 例如 4.0.0-alpha.37 安装版
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 与显示环境
      placeholder: 例如 Windows 11 24H2，150% 缩放，双显示器
    validations:
      required: true

  - type: dropdown
    id: background
    attributes:
      label: 背景类型
      options:
        - 纯色默认
        - 天空少女皮肤
        - 本地图片
        - 本地视频
        - 与背景无关
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或补充信息
      description: 可粘贴经过脱敏的相关日志、网络状态或视频编码信息。
